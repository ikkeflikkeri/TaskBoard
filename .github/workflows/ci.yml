name: CI

on:
  push:
    # Feature branches are tested by the pull_request trigger.
    # Leaving push unscoped runs the same suite twice per push.
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs. Keyed on the PR number so repeat pushes do
# not queue several suites; falls back to the branch ref for pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show SDK and Docker information
        run: |
          dotnet --info
          docker info

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore locked packages
        run: dotnet restore TaskBoard.slnx --locked-mode

      - name: Build
        run: dotnet build TaskBoard.slnx --configuration Release --no-restore

      - name: Run tests
        run: >
          dotnet test TaskBoard.slnx
          --configuration Release
          --no-build
          --logger "trx"
          --results-directory artifacts/test-results

      - name: Check migration drift
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/TaskBoard.Api/TaskBoard.Api.csproj
          --startup-project src/TaskBoard.Api/TaskBoard.Api.csproj
          --configuration Release
          --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore
          retention-days: 7
